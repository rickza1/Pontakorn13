<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เว็บไซต์แนะนำตัว</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f0f4ff;
    color: #333;
    text-align: center;
}

header {
    background: #526dff;
    color: white;
    padding: 50px 20px;
}

.profile {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    border: 4px solid white;
    object-fit: cover;
}

section {
    background: white;
    margin: 25px auto;
    padding: 30px;
    max-width: 600px;
    border-radius: 15px;
    box-shadow: 0 3px 10px #ddd;
}

h2 {
    color: #526dff;
    margin-bottom: 15px;
}

footer {
    background: #526dff;
    color: white;
    padding: 20px;
    margin-top: 30px;
}
</style>
</head>

<body>

<header>
    <img class="profile"
    src="https://placehold.co/130x130"
    alt="รูปโปรไฟล์">

    <h1>สวัสดีครับ ผมชื่อพนธกร รัตนพักตร์</h1>
    <p>ยินดีต้อนรับเข้าสู่เว็บไซต์</p>
</header>

<section>
    <h2>เกี่ยวกับฉัน</h2>
    <p>
        สวัสดีครับ ผมชื่อ พนธกร รัตนพักตร์
        ปัจจุบันกำลังศึกษาอยู่ที่ วิทยาลัยอาชีวศึกษาภูเก็ต

    </p>
</section>

<section>
    <h2>ความสามารถ</h2>
    <p>💻 การใช้คอมพิวเตอร์</p>
</section>



<footer>
    <p>© 2026 เว็บไซต์แนะนำตัวของฉัน</p>
</footer>

</body>
</html>
